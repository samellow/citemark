# Every component of Citemark's four surfaces (UI kit 5): the one hand-kept part of the build
# status. Each lists its renderers (J Jinja, R React, P Preact, L the loader), the roadmap phase
# that first needs it, its states, the strings it shows (file:key, from content/en/), where it's
# specified, and the design-system artifact's prototype of it, if any.
#
# A component is specified here before any code (UI kit 7, rule 1). Its gallery pages come from
# design/fixtures/, one per state. String keys of components not built yet follow the content
# spec, and may move when the component is built. "Prototype ... (stale)" means the artifact's
# preview predates a later decision: build from the spec, not from it.

components:
  # --- Foundations (UI kit 5.1) ---
  - name: Tokens
    layer: foundation
    renderers: [All]
    phase: "1"
    states: [light, dark]
    strings: []
    spec: UI kit 3; design system 3
    prototype: tokens.json (current)
  - name: BaseStylesheet
    layer: foundation
    renderers: [CSS]
    phase: "1"
    states: [light, dark, print]
    strings: []
    spec: UI kit 5.1; design system 3.2, 6.7
    prototype: bundle.css (seed)
  - name: Fonts
    layer: foundation
    renderers: [CSS]
    phase: "1"
    states: []
    strings: []
    spec: UI kit 3
    prototype: null
  - name: Glyphs
    layer: foundation
    renderers: [J, R, P, L]
    phase: "1-2"
    states: [pass, fail, warn, declined, chat, close, send, stop, minimize, expand, previous, next, new_tab]
    strings: []
    spec: UI kit 3 (13 glyphs, 8 drawn in the artifact)
    prototype: 8 of 13 drawn
  - name: Gallery
    layer: foundation
    renderers: [All]
    phase: "1"
    states: []
    strings: []
    spec: UI kit 4
    prototype: null

  # --- Shared primitives (UI kit 5.2) ---
  - name: Wordmark
    layer: primitive
    renderers: [J, R]
    phase: "1"
    states: [sm, md, lg]
    strings: []  # the name is the logo, set in type, not copy
    spec: UI kit 5.2; design system 3
    prototype: Wordmark (current)
  - name: CitationMarker
    layer: primitive
    renderers: [J, P]
    phase: "1"
    states: [tinted, outlined, active]
    strings: [report:evidence.marker_a11y, widget:answer.marker_a11y]
    spec: UI kit 5.2; design system 3, 6.1
    prototype: CitationMarker (current)
  - name: StateMark
    layer: primitive
    renderers: [J, R]
    phase: "1"
    states: [pass, fail, warn, declined, own_label]
    strings: [report:state.pass, report:state.fail, report:state.warn, report:state.declined]
    spec: UI kit 5.2; design system 3.1
    prototype: StateMark (current)
  - name: Button
    layer: primitive
    renderers: [J, R, P]
    phase: "1"
    states: [primary, quiet, accent, disabled]
    strings: []  # each label comes from the caller
    spec: UI kit 5.2
    prototype: Button (current)
  - name: Field
    layer: primitive
    renderers: [J, R, P]
    phase: "1"
    states: [text, email, password, long_text, with_help, with_error]
    strings: []  # each label, help and error comes from the caller
    spec: UI kit 5.2
    prototype: styles only, inside Handoff
  - name: Copyable
    layer: primitive
    renderers: [R, P]
    phase: "2"
    states: [idle, copied]
    strings: [widget:handoff.copy, widget:handoff.copied]
    spec: UI kit 5.2; design system 6.3
    prototype: styles only, inside Handoff

