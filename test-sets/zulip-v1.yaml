    question: "How do I edit a message I already sent?"
    expected_answer:
      - "Desktop/Web: hover over the message, click the pencil icon, change the content, click Save"
      - "Mobile: press and hold the message, tap Edit message, change the content, tap Save"
      - "Administrators control who can edit messages and can set a time limit for editing"
      - "Even organization owners cannot edit the content of a message someone else sent"
      - "Everyone sees the message labeled as edited afterwards, and the edit history can be viewed if the organization allows it"
    expected_sources:
      - url: https://zulip.com/help/edit-a-message
        section: Edit a message
        quote: "Organization administrators can configure who can edit messages, and set time limits for this action."
      - url: https://zulip.com/help/edit-a-message
        section: Edit a message
        quote: "Hover over a message to reveal three icons on the right."
