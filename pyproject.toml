[project]
name = "citemark"
version = "0.1.0"
description = "A support bot that ships with a test report on its own help center: right answers, the right sources, and honest declines."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "samellow", email = "76571255+samellow@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.12.1",
    "asyncpg>=0.32.0",
    "pgvector>=0.5.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.4",
    "typer>=0.27.3",
]

[project.scripts]
citemark = "citemark.cli:app"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM905"]  # word lists read better as "a b c".split()

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/citemark/db/migrations/versions/*" = ["E501"]  # generated column and constraint lines
