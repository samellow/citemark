# Local development: Postgres 16 with pgvector, as on the hosts (PRD 3).
# Host port 54320, so it doesn't clash with a Postgres already on 5432.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: citemark
      POSTGRES_PASSWORD: citemark
      POSTGRES_DB: citemark
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citemark -d citemark"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db:
