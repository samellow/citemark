name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: citemark
          POSTGRES_PASSWORD: citemark
          POSTGRES_DB: citemark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citemark -d citemark"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://citemark:citemark@localhost:5432/citemark
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - name: Migrations also run down and back up
        run: uv run alembic downgrade base && uv run alembic upgrade head
      - name: The Zulip snapshot's raw HTML, from the freeze tag's release, checked against the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download zulip-v1-frozen --pattern raw.tar.gz --dir fixtures/zulip
          echo "$(jq -r .raw_tarball_sha256 fixtures/zulip/manifest.json)  fixtures/zulip/raw.tar.gz" | sha256sum --check
          tar -xzf fixtures/zulip/raw.tar.gz -C fixtures/zulip
      - run: uv run pytest

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"
      - name: Dependency audit
        run: |
          uv export --frozen --no-emit-project --output-file "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --disable-pip --requirement "$RUNNER_TEMP/requirements.txt"

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag citemark:ci .
      - run: docker run --rm citemark:ci --help
      - name: The prompts are in the image
        run: docker run --rm --entrypoint python citemark:ci -c "from citemark import prompts; prompts.load('rewrite.v1')"
