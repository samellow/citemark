name: nightly

# QA plan 3.2 and 7.2: five known questions through the real APIs with Haiku, which no commit's
# CI calls. It catches an API or model change, not accuracy. The API keys are repository secrets,
# so it runs only on its schedule or when started from the Actions tab, never on a pull request.
# A failure opens an issue, or adds to the one already open; the next pass closes it.

on:
  schedule:
    - cron: "23 5 * * *" # daily, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: citemark
          POSTGRES_PASSWORD: citemark
          POSTGRES_DB: citemark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citemark -d citemark"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://citemark:citemark@localhost:5432/citemark
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - name: Five known questions with Haiku, through Claude and Voyage (an estimated half a cent)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: uv run citemark test live 2>&1 | tee live.txt
      - name: The answers on the run's summary page
        if: always()
        run: |
          { echo '```'; cat live.txt 2>/dev/null || echo "The run didn't start."; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  report:
    needs: live
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open an issue on a failure, or close it on the next pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.live.result }}
        run: |
          title="The nightly live run failed"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ "$RESULT" = success ]; then
            if [ -n "$open" ]; then gh issue close "$open" --comment "Passed again: $run"; fi
          elif [ "$RESULT" = failure ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "Failed again: $run"
            else
              gh issue create --title "$title" --body "Five known questions through Claude and Voyage (QA plan 3.2) failed a check: $run. The run's summary shows each answer and what failed. The next run that passes closes this."
            fi
          fi
