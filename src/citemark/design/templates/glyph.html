<ul class="cm-gallery-glyphs">
<li><span class="cm-gallery-glyph">{{ glyph(name) }}</span> {{ name }} at 16px, in text</li>
<li><span class="cm-gallery-glyph cm-state-{{ name }}">{{ glyph(name) }}</span> {{ name }} at 16px, in its state's color</li>
<li><span class="cm-gallery-glyph cm-gallery-glyph-lg">{{ glyph(name) }}</span> {{ name }} at 48px, to check the drawing</li>
</ul>
